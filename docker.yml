services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  bot:
    build: ./bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - ./bot/.env
    environment:
      - OLLAMA_HOST=ollama

volumes:
  ollama_data:
